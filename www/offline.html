<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnata</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0f1f; color: #e8ecf8; font-family: system-ui, sans-serif; }
  .box { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; gap: 10px; }
  .ico { font-size: 64px; }
  p { color: #8a94b8; max-width: 320px; line-height: 1.5; }
  button { border: 0; border-radius: 12px; padding: 14px 22px; font: inherit; font-weight: 800; color: #04281a; background: linear-gradient(180deg, #2ee59d, #16b877); box-shadow: 0 3px 0 #0b7a4f; }
</style>
</head>
<body>
<div class="box">
  <div class="ico">📡</div>
  <h2>Sem conexão</h2>
  <p>O Magnata precisa de internet para abrir. Seu progresso está salvo no celular — conecte-se e toque abaixo.</p>
  <button onclick="location.href='https://kl4326.github.io/jogo-rich-mobile/'">Tentar de novo</button>
</div>
</body>
</html>
